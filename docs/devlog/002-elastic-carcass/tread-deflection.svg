  <title id="title">Tread patch deflection and timestep comparison</title>
  <desc id="description">Three traces sampled at 60 Hz nearly overlap. The patch moves inward under load through 0.5 seconds, rebounds past rest after release, and returns close to rest by 2 seconds. The greatest adjacent timestep differences are 0.0972 and 0.0465 millimetres.</desc>
