<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Wheel-first strike against a finite side wall</title>
  <desc id="desc">From the front, the front-left tyre moves to the right toward a vertical wall. The wall runs from 0.08 to 0.65 metres above the road. The outer bead ring can reach it after the sidewall compresses.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#294967"/>
    </marker>
  </defs>
  <rect width="720" height="280" rx="10" fill="#f2f6fa"/>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#132943">
    <text x="32" y="38" font-weight="bold">Front view of the lateral strike</text>
    <path d="M130 220 H635" stroke="#878d95" stroke-width="3"/>
    <text x="135" y="245">Road</text>
    <path d="M428 64 V201" stroke="#b84532" stroke-width="6" stroke-linecap="round"/>
    <text x="450" y="69">Top edge, 0.65 m</text>
    <text x="450" y="206">Bottom edge, 0.08 m</text>
    <path d="M229 94 Q257 63 312 64 Q369 65 398 94 L391 189 Q377 219 312 220 Q252 218 237 187 Z"
          fill="#d9e8f2" stroke="#294967" stroke-width="2"/>
    <path d="M262 101 V179 M361 101 V179 M262 140 H361" fill="none" stroke="#294967" stroke-width="5"/>
    <path d="M175 125 H215" stroke="#294967" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="103" y="108">2.5 m/s</text>
    <path d="M502 135 H365" stroke="#294967" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="510" y="141">Outer bead</text>
    <path d="M623 248 h34 M623 248 v-29" stroke="#294967" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="663" y="254">+X</text>
    <text x="614" y="213">+Y</text>
  </g>
</svg>
