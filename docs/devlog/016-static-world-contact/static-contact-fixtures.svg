<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290" role="img" aria-labelledby="title desc">
  <title id="title">Static obstacle contact fixtures</title>
  <desc id="desc">A wide bumper approaches a narrow post. An exposed wheel makes lateral wall contact while its tread rests on the road.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#1662a4"/>
    </marker>
  </defs>
  <rect width="840" height="290" rx="12" fill="#f4f7fa"/>
  <path d="M421 26v238" stroke="#ced9e2"/>
  <g font-family="sans-serif" font-size="15" fill="#213244">
    <text x="32" y="36" font-size="19" font-weight="bold">Post strike · top view</text>
    <text x="452" y="36" font-size="19" font-weight="bold">Wheel-first strike · end view</text>
    <text x="226" y="81">120 mm post</text>
    <text x="104" y="199">Bumper panel</text>
    <text x="205" y="252" text-anchor="middle">1,500 mm between nodes</text>
    <text x="578" y="77">Wheel</text>
    <text x="745" y="144">Wall</text>
    <text x="470" y="133">Chassis</text>
    <text x="470" y="151">point</text>
    <text x="645" y="250">Road</text>
  </g>
  <path d="M385 141v-53" stroke="#1662a4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="379" y="83" fill="#1662a4" font-family="sans-serif" font-size="14">+Z</text>
  <rect x="195" y="65" width="20" height="47" fill="#dc8d55" stroke="#934d20" stroke-width="2"/>
  <path d="M205 156v-36" stroke="#1662a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M80 171H330" stroke="#1662a4" stroke-width="6"/>
  <circle cx="80" cy="171" r="7" fill="#18374f"/>
  <circle cx="330" cy="171" r="7" fill="#18374f"/>
  <path d="M80 222H330M80 215v14m250-14v14" stroke="#526c80"/>
  <path d="M458 225H798" stroke="#526c80" stroke-width="4"/>
  <path d="M737 87v109" stroke="#934d20" stroke-width="5"/>
  <rect x="566" y="87" width="100" height="137" rx="32" fill="#bfd4e7" stroke="#18374f" stroke-width="3"/>
