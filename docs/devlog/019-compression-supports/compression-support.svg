<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
  <title id="title">Axial force on a chassis compression support</title>
  <desc id="desc">When two nodes move closer than their stress-free spacing, the support pushes them apart. When they move farther apart, it goes slack and exerts zero force.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#075985"/>
    </marker>
  </defs>
  <rect width="640" height="190" rx="12" fill="#f1f5f9"/>
  <path d="M320 28 V162" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#172b4d" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="160" y="44" font-size="18" font-weight="bold">Compressed</text>
    <text x="480" y="44" font-size="18" font-weight="bold">Extended</text>
    <text x="160" y="155" font-size="15">Equal and opposite forces</text>
    <text x="480" y="155" font-size="15">Zero axial force</text>
  </g>
  <path d="M116 101 H204" stroke="#075985" stroke-width="5"/>
  <path d="M378 101 H582" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M110 101 H68 M210 101 H252" fill="none" stroke="#075985" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#fff" stroke="#172b4d" stroke-width="2">
    <circle cx="120" cy="101" r="8"/>
    <circle cx="200" cy="101" r="8"/>
    <circle cx="378" cy="101" r="8"/>
    <circle cx="582" cy="101" r="8"/>
  </g>
</svg>
