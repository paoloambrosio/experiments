<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 518" role="img" aria-labelledby="title description">
  <title id="title">Pressure and effective opening after first kerb contact</title>
  <desc id="description">The 6 metre per second tearing case drops to about 15 kilopascals over five seconds. Both controls stay near 30 kilopascals. The opening grows in three steps to 12.27 square millimetres within 23 milliseconds.</desc>
