<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 522" role="img" aria-labelledby="title desc">
<title id="title">Loaded suspension traces over a 20 mm step</title>
<desc id="desc">The axle rises first at about 6.2 seconds, then the sprung mass rises and overshoots. Spring compression peaks about 11 mm above sag. Vertical road force rises on entry and settles around 2453 newtons.</desc>
