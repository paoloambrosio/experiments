<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 409" role="img" aria-labelledby="title desc">
  <title id="title">Loaded wheel crossing the triangle ramp</title>
  <desc id="desc">At 3,840 substeps per second the axle starts climbing before the ramp begins at 3.5 m and settles 100 mm higher on the platform. Spring travel oscillates around nominal sag as the wheel crosses the joins.</desc>
