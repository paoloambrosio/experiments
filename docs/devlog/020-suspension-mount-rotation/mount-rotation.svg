<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title desc">
  <title id="title">Shortest rotation from a wheel upright to its suspension mount</title>
  <desc id="desc">Two arrows share a pivot. The upright arrow points up and the mount arrow is slightly clockwise. A short arc marks the correction between them.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="228" rx="12" fill="#f4f7fb" stroke="#b9c6d6"/>
  <g fill="none" stroke-width="3" marker-end="url(#head)">
    <path d="M 295 191 V 36" stroke="#245598"/>
    <path d="M 295 191 L 344 44" stroke="#167869"/>
    <path d="M 296 92 A 99 99 0 0 1 325 97" stroke="#965006"/>
  </g>
  <circle cx="295" cy="191" r="5" fill="#202d40"/>
  <g font-family="sans-serif" font-size="17" fill="#202d40">
    <text x="106" y="49">Upright orientation</text>
    <text x="361" y="50">Mount orientation</text>
    <text x="352" y="111">Angular correction</text>
  </g>
</svg>
