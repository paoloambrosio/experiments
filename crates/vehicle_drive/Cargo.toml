[package]
name = "vehicle_drive"
version = "0.1.0"
edition.workspace = true

[dependencies]
avian3d.workspace = true
bevy = { workspace = true, features = ["3d", "ui"] }
clap = "4.6"
image = { version = "0.25.10", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
vehicle_assets = { path = "../vehicle_assets" }
vehicle_physics = { path = "../vehicle_physics", features = ["avian"] }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
