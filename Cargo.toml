[workspace]
members = [
    "crates/vehicle_physics",
    "crates/vehicle_lab",
    "crates/vehicle_assets",
    "crates/vehicle_drive",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
avian3d = { version = "0.8.0", default-features = false, features = ["3d", "parry-f32"] }
bevy = { version = "0.20.1", default-features = false }
bevy_math = "0.20.1"
tempfile = "3"
zip = { version = "9.8.2", default-features = false }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
